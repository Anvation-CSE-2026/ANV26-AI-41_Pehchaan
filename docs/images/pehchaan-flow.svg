<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Pehchaan product flow</title>
  <desc id="desc">Five steps: capture a thought, map a brief, adapt to a voice, prepare channel drafts, then edit and approve.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8eb"/><stop offset="1" stop-color="#f1f6ec"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#304538" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <g font-family="Aptos,Segoe UI,sans-serif">
    <text x="52" y="57" fill="#1e4639" font-size="24" font-weight="750">From rough thought to ready-to-review</text>
    <text x="53" y="82" fill="#718076" font-size="13">The creator stays in the loop at every step.</text>
    <g stroke="#96b6a1" stroke-width="3" stroke-linecap="round">
      <path d="M238 202h35"/><path d="M468 202h35"/><path d="M698 202h35"/><path d="M928 202h35"/>
    </g>
    <g fill="#96b6a1">
      <path d="m264 195 10 7-10 7z"/><path d="m494 195 10 7-10 7z"/><path d="m724 195 10 7-10 7z"/><path d="m954 195 10 7-10 7z"/>
    </g>
    <g filter="url(#shadow)">
      <rect x="48" y="122" width="190" height="158" rx="18" fill="#fff"/>
      <rect x="278" y="122" width="190" height="158" rx="18" fill="#e6f3e9"/>
      <rect x="508" y="122" width="190" height="158" rx="18" fill="#ffeadf"/>
      <rect x="738" y="122" width="190" height="158" rx="18" fill="#e8e9fb"/>
      <rect x="968" y="122" width="184" height="158" rx="18" fill="#1f5544"/>
    </g>
    <g font-size="11" font-weight="700" letter-spacing="1.1">
      <text x="68" y="151" fill="#869187">01 · CAPTURE</text><text x="298" y="151" fill="#548264">02 · SHAPE</text>
      <text x="528" y="151" fill="#ba7053">03 · ADAPT</text><text x="758" y="151" fill="#6969a0">04 · PREPARE</text>
      <text x="988" y="151" fill="#c5e6d0">05 · REVIEW</text>
    </g>
    <g font-size="17" font-weight="750">
      <text x="68" y="184" fill="#263a33">Say or type</text><text x="298" y="184" fill="#263a33">Map the brief</text>
      <text x="528" y="184" fill="#263a33">Use your voice</text><text x="758" y="184" fill="#263a33">Build 3 drafts</text>
      <text x="988" y="184" fill="#fff8eb">Edit &amp; approve</text>
    </g>
    <g fill="#6f7d73" font-size="12">
      <text x="68" y="211">Idea, post examples,</text><text x="68" y="229">or local speech input</text>
      <text x="298" y="211">Audience, goal, facts,</text><text x="298" y="229">channel &amp; word target</text>
      <text x="528" y="211">Saved profile, examples,</text><text x="528" y="229">or style preferences</text>
      <text x="758" y="211">Instagram, LinkedIn,</text><text x="758" y="229">and X adaptations</text>
      <text x="988" y="211" fill="#d9e9dd">You keep the final say;</text><text x="988" y="229" fill="#d9e9dd">publishing is optional</text>
    </g>
    <g>
      <circle cx="84" cy="254" r="5" fill="#ef8b72"/><circle cx="104" cy="254" r="5" fill="#f1bf59"/><circle cx="124" cy="254" r="5" fill="#66ba92"/>
      <rect x="298" y="246" width="54" height="20" rx="10" fill="#cfe8d4"/><text x="325" y="260" text-anchor="middle" fill="#477252" font-size="9" font-weight="700">FACTS</text>
      <rect x="359" y="246" width="78" height="20" rx="10" fill="#dce9da"/><text x="398" y="260" text-anchor="middle" fill="#477252" font-size="9" font-weight="700">CONSTRAINTS</text>
      <circle cx="550" cy="255" r="7" fill="#f3b65d"/><circle cx="571" cy="255" r="7" fill="#81c5a0"/><circle cx="592" cy="255" r="7" fill="#91a6df"/>
      <rect x="758" y="246" width="47" height="20" rx="10" fill="#f2c9dd"/><text x="781" y="260" text-anchor="middle" fill="#8c5570" font-size="9" font-weight="700">IG</text>
      <rect x="811" y="246" width="58" height="20" rx="10" fill="#c8dcf3"/><text x="840" y="260" text-anchor="middle" fill="#4d6484" font-size="9" font-weight="700">LINKEDIN</text>
      <rect x="875" y="246" width="29" height="20" rx="10" fill="#d5d5df"/><text x="889" y="260" text-anchor="middle" fill="#50525d" font-size="9" font-weight="700">X</text>
      <path d="m991 254 6 6 11-13" fill="none" stroke="#a5e0b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
