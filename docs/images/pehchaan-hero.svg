<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Pehchaan: posts that sound like you</title>
  <desc id="desc">An illustrated campaign workspace turns one idea into Instagram, LinkedIn, and X drafts in a creator's voice.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#112e32"/><stop offset="1" stop-color="#203f37"/></linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9b72"/><stop offset="1" stop-color="#ef5b65"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b7f2ce"/><stop offset="1" stop-color="#69d5b1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#081c20" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <circle cx="1100" cy="54" r="190" fill="#f4bd5c" opacity=".14"/>
  <circle cx="94" cy="640" r="220" fill="#ef6b68" opacity=".12"/>
  <path d="M0 526C185 450 288 676 507 590s372-119 693-12v122H0z" fill="#0d272d" opacity=".45"/>
  <g font-family="Aptos,Segoe UI,sans-serif">
    <rect x="66" y="54" width="44" height="44" rx="15" fill="url(#mint)"/>
    <path d="M79 82V67h7c5 0 8 2 8 6s-3 6-8 6h-2v3zM84 75h2c2 0 3-.6 3-2s-1-2-3-2h-2z" fill="#173c36"/>
    <text x="123" y="84" fill="#fff9ee" font-size="27" font-weight="700">pehchaan</text>
    <text x="66" y="178" fill="#fff9ee" font-size="56" font-weight="750" letter-spacing="-2">One idea.</text>
    <text x="66" y="239" fill="#fff9ee" font-size="56" font-weight="750" letter-spacing="-2">Your voice.</text>
    <text x="68" y="282" fill="#bcd0c5" font-size="19">Posts that sound like you.</text>
    <rect x="66" y="322" width="238" height="38" rx="19" fill="#ffffff" opacity=".10"/>
    <circle cx="86" cy="341" r="5" fill="#f4bd5c"/>
    <text x="101" y="346" fill="#eaf3e9" font-size="13" font-weight="600">A creator-first writing workspace</text>
    <text x="68" y="414" fill="#d8e4dc" font-size="14" font-weight="700" letter-spacing="1.5">ONE BRIEF, SHAPED INTO</text>
    <rect x="66" y="432" width="78" height="34" rx="17" fill="#e9a1c8"/><text x="105" y="454" text-anchor="middle" fill="#35243a" font-size="13" font-weight="700">Instagram</text>
    <rect x="154" y="432" width="78" height="34" rx="17" fill="#9bc9f5"/><text x="193" y="454" text-anchor="middle" fill="#1d3450" font-size="13" font-weight="700">LinkedIn</text>
    <rect x="242" y="432" width="38" height="34" rx="17" fill="#f4bd5c"/><text x="261" y="454" text-anchor="middle" fill="#392d1e" font-size="13" font-weight="700">X</text>
    <text x="68" y="524" fill="#bcd0c5" font-size="14">Build a consistent voice. Keep the final edit yours.</text>
  </g>
  <g filter="url(#shadow)" font-family="Aptos,Segoe UI,sans-serif">
    <rect x="366" y="112" width="315" height="477" rx="24" fill="#fffaf1"/>
    <text x="397" y="154" fill="#758177" font-size="11" font-weight="700" letter-spacing="1.5">YOUR CAMPAIGN BRIEF</text>
    <text x="397" y="190" fill="#243a34" font-size="21" font-weight="700">A thought worth sharing</text>
    <rect x="397" y="209" width="252" height="91" rx="12" fill="#f3f1e7"/>
    <text x="414" y="239" fill="#4f6056" font-size="13">The small moments that make</text>
    <text x="414" y="259" fill="#4f6056" font-size="13">our neighborhood feel like home…</text>
    <rect x="397" y="318" width="252" height="1" fill="#e8e5da"/>
    <text x="397" y="350" fill="#758177" font-size="11" font-weight="700" letter-spacing="1.5">VOICE PROFILE</text>
    <circle cx="415" cy="383" r="15" fill="#f2b96c"/>
    <path d="M409 386c4-10 8-10 12 0" fill="none" stroke="#72553a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="415" cy="378" r="3" fill="#72553a"/>
    <text x="440" y="380" fill="#263a33" font-size="14" font-weight="700">Warm, clear, community-first</text>
    <text x="440" y="399" fill="#7b857c" font-size="11">Grounded in your examples and choices</text>
    <rect x="397" y="426" width="252" height="1" fill="#e8e5da"/>
    <text x="397" y="457" fill="#758177" font-size="11" font-weight="700" letter-spacing="1.5">DRAFT CONTROLS</text>
    <rect x="397" y="472" width="74" height="27" rx="13" fill="#e0f2e4"/><text x="434" y="490" text-anchor="middle" fill="#37664c" font-size="11" font-weight="700">English</text>
    <rect x="479" y="472" width="73" height="27" rx="13" fill="#fce7d9"/><text x="515" y="490" text-anchor="middle" fill="#9a5938" font-size="11" font-weight="700">80 words</text>
    <rect x="397" y="521" width="252" height="42" rx="11" fill="#215a47"/>
    <text x="523" y="548" text-anchor="middle" fill="#fffaf1" font-size="13" font-weight="700">Build my campaign pack  →</text>
  </g>
  <g filter="url(#shadow)" font-family="Aptos,Segoe UI,sans-serif">
    <rect x="724" y="112" width="410" height="477" rx="24" fill="#e9f1e7"/>
    <text x="756" y="154" fill="#758177" font-size="11" font-weight="700" letter-spacing="1.5">THREE CHANNEL VERSIONS</text>
    <rect x="756" y="178" width="346" height="103" rx="16" fill="#fffaf1"/>
    <rect x="772" y="195" width="32" height="32" rx="10" fill="#f4c2d9"/>
    <circle cx="788" cy="211" r="8" fill="none" stroke="#9c5476" stroke-width="2"/><circle cx="788" cy="211" r="3" fill="#9c5476"/>
    <text x="818" y="207" fill="#253b34" font-size="14" font-weight="700">Instagram caption</text>
    <text x="818" y="228" fill="#7b857c" font-size="11">A little more color. A little more you.</text>
    <rect x="818" y="244" width="113" height="5" rx="3" fill="#dce5d9"/><rect x="818" y="244" width="76" height="5" rx="3" fill="#ee8c79"/>
    <rect x="756" y="296" width="346" height="103" rx="16" fill="#fffaf1"/>
    <rect x="772" y="313" width="32" height="32" rx="10" fill="#c6dcf4"/>
    <text x="788" y="335" text-anchor="middle" fill="#4b6385" font-size="14" font-weight="800">in</text>
    <text x="818" y="325" fill="#253b34" font-size="14" font-weight="700">LinkedIn post</text>
    <text x="818" y="346" fill="#7b857c" font-size="11">A clear story with room to breathe.</text>
    <rect x="818" y="362" width="113" height="5" rx="3" fill="#dce5d9"/><rect x="818" y="362" width="91" height="5" rx="3" fill="#78a9d3"/>
    <rect x="756" y="414" width="346" height="103" rx="16" fill="#fffaf1"/>
    <rect x="772" y="431" width="32" height="32" rx="10" fill="#252f34"/>
    <text x="788" y="453" text-anchor="middle" fill="#fff" font-size="17" font-weight="800">𝕏</text>
    <text x="818" y="443" fill="#253b34" font-size="14" font-weight="700">X post</text>
    <text x="818" y="464" fill="#7b857c" font-size="11">The short version, still in your voice.</text>
    <rect x="818" y="480" width="113" height="5" rx="3" fill="#dce5d9"/><rect x="818" y="480" width="59" height="5" rx="3" fill="#485e68"/>
    <rect x="756" y="540" width="153" height="30" rx="15" fill="#d7efe0"/>
    <circle cx="773" cy="555" r="5" fill="#449a68"/>
    <text x="786" y="559" fill="#37664c" font-size="11" font-weight="700">Edit and approve</text>
  </g>
  <path d="M691 351h22" stroke="#f4bd5c" stroke-width="3" stroke-linecap="round"/><path d="m706 344 8 7-8 7" fill="none" stroke="#f4bd5c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="66" y="650" fill="#91aaa0" font-family="Aptos,Segoe UI,sans-serif" font-size="11" letter-spacing="1.2">PRODUCT ILLUSTRATION · NOT A SCREENSHOT</text>
</svg>
